<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zero-Trust & Security+ Incident Triage Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
/* Layout: SOC console. Banner, demo row, score strip, then a two-tab panel. Dark by design. */
:root{--bg:#0b1118;--panel:#111a24;--line:#243242;--ink:#cbd5e1;--rose:#fb7185;--amber:#fbbf24;color-scheme:dark}
body{background:var(--bg);color:var(--ink)}
#root{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
textarea,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
<div id="root"></div>
<script>
const {useState}=React,h=React.createElement,e=(t,c,...k)=>h(t,{className:c},...k);
const TOG=[
 {id:"tok",label:"Revoke Active IAM/Session Tokens",ctl:"Continuous verification: assume breach, force re-authentication of every session",obj:"1.2 Zero Trust, 4.6 IAM"},
 {id:"sg",label:"Isolate Host Security Group",ctl:"Micro-segmentation: the policy enforcement point cuts lateral movement",obj:"3.2 Infrastructure, 4.5 Firewall rules"},
 {id:"mem",label:"Snapshot Volatile Memory/Logs",ctl:"Evidence preservation before any reboot, with chain of custody",obj:"4.8 Incident response, 4.9 Data sources"},
 {id:"mfa",label:"Trigger Mandatory MFA Reset",ctl:"Strong authentication: re-enroll factors and retire stale credentials",obj:"4.6 IAM, 2.2 Social engineering"}];
const CR={std:"Standard",high:"High",reg:"Regulated PHI/PII"};
const SC={
 phish:{n:"Phishing Credential Theft",w:{tok:35,sg:15,mem:20,mfa:30},
  dom:["Domain 2.0 Threats: 2.2 Social engineering vectors","Domain 4.0 Operations: 4.6 IAM, 4.8 Incident response","Domain 1.0 Concepts: 1.2 Zero Trust, verify explicitly"],
  pb:["Isolate the user's endpoint. Do not reboot it.","Revoke sessions and OAuth tokens issued since the click.","Preserve mail headers, proxy and IdP logs, then purge the message tenant-wide.","Force MFA re-enrollment and check mailbox rules for silent forwarding."]},
 bucket:{n:"Unencrypted S3/GCS Bucket Exposure",w:{tok:30,sg:35,mem:25,mfa:10},
  dom:["Domain 3.0 Architecture: 3.3 Data protection, encryption at rest","Domain 4.0 Operations: 4.4 Monitoring, 4.9 Access logs","Domain 5.0 Program Mgmt: 5.4 Compliance and breach notice"],
  pb:["Block public access and tighten the bucket policy at once.","Export object-access logs before any lifecycle rule rotates them.","Rotate keys and service-account credentials that could reach the bucket.","Enable default encryption, then size the exposure window for the Security Officer."]},
 ssh:{n:"Suspicious SSH Brute-Force on Linux",w:{tok:15,sg:35,mem:25,mfa:25},
  dom:["Domain 2.0 Threats: 2.4 Indicators of malicious activity","Domain 3.0 Architecture: 3.2 Bastion hosts, segmentation","Domain 4.0 Operations: 4.5 Firewall and access rules"],
  pb:["Restrict the SSH source range in the security group.","Copy auth.log, journal and a memory image before touching the host.","Check for a successful login after the failures, then audit authorized_keys.","Move to key-only auth with MFA through the bastion."]},
 ransom:{n:"Ransomware Lateral Movement",w:{tok:25,sg:35,mem:30,mfa:10},
  dom:["Domain 2.0 Threats: 2.4 Malware indicators","Domain 3.0 Architecture: 3.4 Resilience, immutable backups","Domain 4.0 Operations: 4.8 Containment, eradication, recovery"],
  pb:["Isolate affected hosts and segments. Leave them powered on.","Capture memory: encryption keys may still be resident.","Revoke domain and service tokens used for the spread.","Verify offline backups before any restore decision."]}};
const score=(s,c,on)=>{let v=Object.keys(SC[s].w).reduce((a,k)=>a+(on[k]?SC[s].w[k]:0),0);
 if(c==="reg"&&!(on.mem&&on.sg))v-=20; if(c==="high"&&!on.sg)v-=10; return Math.max(0,Math.min(100,v))};
const label=v=>v>=80?"Contained":v>=50?"Partial":"Exposed";
const tone=v=>v>=80?"text-emerald-400":v>=50?"text-amber-400":"text-rose-400";
const bar=v=>v>=80?"bg-emerald-400":v>=50?"bg-amber-400":"bg-rose-500";
const DEMOS=[["Regulated Clinic Phishing Alert","phish","reg",{tok:true,mfa:true}],["Linux Bastion Brute-Force","ssh","high",{sg:true,mem:true}]];

function App(){
 const [s,setS]=useState("phish"),[c,setC]=useState("std"),[on,setOn]=useState({}),[tab,setTab]=useState(0),[copied,setCopied]=useState(false);
 const S=SC[s],v=score(s,c,on);
 const done=TOG.filter(t=>on[t.id]).map(t=>t.label),gap=TOG.filter(t=>!on[t.id]).map(t=>t.label);
 const brief=["INCIDENT ESCALATION BRIEF","Scenario: "+S.n,"Asset criticality: "+CR[c],"Containment readiness: "+v+"/100 ("+label(v)+")",
  "Applied: "+(done.join("; ")||"none"),"Open gaps: "+(gap.join("; ")||"none"),
  c==="reg"?"PII/PHI exposure possible: escalate to the human Security Officer now. Do not self-clear.":"Escalate to the human Security Officer if PII/PHI exposure is confirmed.",
  "Reminder: isolate endpoints first and preserve forensic logs before any reboot.","","HUMAN INCIDENT COMMANDER SIGN-OFF REQUIRED"].join("\n");
 const demo=d=>{setS(d[1]);setC(d[2]);setOn(d[3]);setCopied(false)};
 const copy=async()=>{try{await navigator.clipboard.writeText(brief);setCopied(true);setTimeout(()=>setCopied(false),2000)}catch(x){document.getElementById("brief").select()}};
 const sel=(id,val,set,opts)=>h("select",{id,value:val,onChange:ev=>{set(ev.target.value);setCopied(false)},className:"w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-slate-100"},
  Object.keys(opts).map(k=>h("option",{key:k,value:k},typeof opts[k]==="string"?opts[k]:opts[k].n)));
 const card="rounded-lg border border-slate-800 bg-slate-900/60 p-4";
 return e("div","mx-auto max-w-4xl space-y-4",
  e("header","flex items-baseline justify-between gap-3 flex-wrap",
   e("h1","text-xl font-semibold tracking-tight text-slate-100","Zero-Trust & Security+ Incident Triage Simulator"),
   e("span","mono text-xs uppercase tracking-widest text-rose-400","SOC console / SY0-701")),
  e("div","rounded-lg border border-amber-500/50 bg-amber-500/10 p-4 text-sm text-amber-100",
   e("p","mb-2 font-semibold uppercase tracking-wider text-amber-300 text-xs","Governance diligence"),
   e("ul","list-disc space-y-1 pl-5",
    e("li","","Isolate suspected endpoints first. Do not power them off."),
    e("li","","Preserve forensic logs and volatile memory before any reboot."),
    e("li","","Escalate confirmed PII/PHI breaches to the human Security Officer."))),
  e("div","flex flex-wrap gap-2",DEMOS.map(d=>h("button",{key:d[0],onClick:()=>demo(d),className:"rounded-md border border-rose-500/60 bg-rose-500/10 px-3 py-2 text-sm font-medium text-rose-200 hover:bg-rose-500/20"},"Demo: "+d[0]))),
  e("div",card,
   e("div","flex items-end justify-between gap-3",
    e("div","",e("p","text-xs uppercase tracking-widest text-slate-400","Containment readiness"),e("p","mono text-4xl font-bold "+tone(v),v+" / 100")),
    e("p","text-sm font-semibold uppercase tracking-wider "+tone(v),label(v))),
   e("div","mt-3 h-2 w-full overflow-hidden rounded bg-slate-800",e("div","h-full transition-all "+bar(v),{style:{width:v+"%"}}))),
  e("div","flex gap-1 border-b border-slate-800",["Alert Intake & Containment","Playbook & SY0-701 Mapping"].map((t,i)=>
   h("button",{key:t,onClick:()=>setTab(i),"aria-pressed":tab===i,className:"px-3 py-2 text-sm font-medium border-b-2 "+(tab===i?"border-rose-400 text-rose-300":"border-transparent text-slate-400 hover:text-slate-200")},t))),
  tab===0?e("div","space-y-4",
   e("div","grid gap-4 sm:grid-cols-2",
    e("label","block space-y-1 text-sm",e("span","text-slate-400","Incident scenario"),sel("scn",s,setS,SC)),
    e("label","block space-y-1 text-sm",e("span","text-slate-400","Asset criticality"),sel("crit",c,setC,CR))),
   e("div","grid gap-2 sm:grid-cols-2",TOG.map(t=>h("button",{key:t.id,"aria-pressed":!!on[t.id],onClick:()=>{setOn({...on,[t.id]:!on[t.id]});setCopied(false)},
    className:"flex items-center justify-between gap-3 rounded-md border px-3 py-3 text-left text-sm "+(on[t.id]?"border-amber-400/70 bg-amber-400/10 text-amber-100":"border-slate-700 bg-slate-900 text-slate-300 hover:border-slate-500")},
    e("span","",t.label),e("span","mono text-xs "+(on[t.id]?"text-amber-300":"text-slate-500"),on[t.id]?"ON":"OFF")))),
   e("div",card,
    e("div","mb-2 flex items-center justify-between gap-2",e("p","text-xs uppercase tracking-widest text-slate-400","Incident escalation brief"),
     h("button",{onClick:copy,className:"rounded-md bg-amber-400 px-3 py-1 text-xs font-semibold text-slate-900 hover:bg-amber-300"},copied?"Copied":"Copy brief")),
    h("textarea",{id:"brief",readOnly:true,value:brief,rows:11,className:"w-full resize-y rounded-md border border-slate-700 bg-slate-950 p-3 text-xs text-slate-200"}),
    e("p","mt-2 rounded border border-rose-500/50 bg-rose-500/10 px-3 py-2 text-center text-xs font-bold uppercase tracking-widest text-rose-300","Human Incident Commander Sign-Off Required")))
  :e("div","grid gap-4 md:grid-cols-2",
   e("div",card,e("p","mb-2 text-xs uppercase tracking-widest text-slate-400","Playbook: "+S.n),
    e("ol","list-decimal space-y-2 pl-5 text-sm",S.pb.map((p,i)=>e("li","",p)))),
   e("div","space-y-4",
    e("div",card,e("p","mb-2 text-xs uppercase tracking-widest text-slate-400","SY0-701 domains"),
     e("ul","list-disc space-y-1 pl-5 text-sm",S.dom.map(d=>e("li","",d)))),
    e("div",card,e("p","mb-2 text-xs uppercase tracking-widest text-slate-400","Zero-Trust controls"),
     e("ul","space-y-2 text-sm",TOG.map(t=>e("li","flex gap-2",
      e("span","mono mt-0.5 text-xs "+(on[t.id]?"text-emerald-400":"text-rose-400"),on[t.id]?"[APPLIED]":"[MISSING]"),
      e("span","",e("span","text-slate-100",t.ctl),e("span","block text-xs text-slate-500","SY0-701 "+t.obj)))))))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>

</body></html>
