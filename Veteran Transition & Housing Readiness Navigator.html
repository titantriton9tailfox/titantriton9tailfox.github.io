<style>
/* Layout concept: a caseworker's intake folder. Navy header band, numbered folder tabs, one white work card per step. Gold marks cautions and the primary action; emerald marks progress. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#0B1F3A; --muted:#455468; --line:#C9D3E0;
  --navy:#0F2A4A; --navy-ink:#FFFFFF; --navy-sub:#C5D3E6; --btn-ink:#0F2A4A;
  --gold:#F2C14E; --on-gold:#0B1F3A; --gold-ink:#6B4500; --gold-soft:#FBF0CF;
  --emerald:#047857; --emerald-ink:#065F46; --emerald-soft:#D6F3E5;
  --warn:#B45309; --warn-ink:#8A3E06; --warn-soft:#FDEBD3;
  --crit:#B91C1C; --crit-ink:#991B1B; --crit-soft:#FCE3E3;
  --focus:#1D4ED8; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121F; --surface:#0F2038; --surface-2:#132A47; --ink:#E7EEF8; --muted:#A9B8CC; --line:#2C4668;
  --navy:#14355F; --navy-ink:#FFFFFF; --navy-sub:#C5D3E6; --btn-ink:#E7EEF8;
  --gold:#F2C14E; --on-gold:#0B1F3A; --gold-ink:#F6D783; --gold-soft:#3A2E10;
  --emerald:#34D399; --emerald-ink:#6EE7B7; --emerald-soft:#0F3A2C;
  --warn:#F59E0B; --warn-ink:#FBC57A; --warn-soft:#3D2A0D;
  --crit:#F87171; --crit-ink:#FCA5A5; --crit-soft:#401818;
  --focus:#93C5FD; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#0F2038; --surface-2:#132A47; --ink:#E7EEF8; --muted:#A9B8CC; --line:#2C4668;
  --navy:#14355F; --navy-ink:#FFFFFF; --navy-sub:#C5D3E6; --btn-ink:#E7EEF8;
  --gold:#F2C14E; --on-gold:#0B1F3A; --gold-ink:#F6D783; --gold-soft:#3A2E10;
  --emerald:#34D399; --emerald-ink:#6EE7B7; --emerald-soft:#0F3A2C;
  --warn:#F59E0B; --warn-ink:#FBC57A; --warn-soft:#3D2A0D;
  --crit:#F87171; --crit-ink:#FCA5A5; --crit-soft:#401818;
  --focus:#93C5FD; color-scheme:dark;}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
*:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--navy);color:var(--navy-ink);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 1.5rem);padding-bottom:1.5rem}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.75rem}
.card-2{background:var(--surface-2);border:1px solid var(--line);border-radius:.6rem}
.h2{font-size:1.25rem;font-weight:800;line-height:1.25;text-wrap:balance}
.h3{font-size:1rem;font-weight:700;line-height:1.3;text-wrap:balance}
.lg{font-weight:700;font-size:.95rem;padding:0;margin-bottom:.25rem}
.help{font-size:.85rem;color:var(--muted);margin:0 0 .5rem}
.grp{border:0;padding:0;margin:0;min-width:0}
.lnk{color:var(--emerald-ink);text-decoration:underline;text-underline-offset:2px;font-weight:600}
.privacy{background:var(--gold-soft);border:2px solid var(--gold);border-radius:.75rem;color:var(--ink)}
.privacy .k{color:var(--gold-ink)}
.crit-box{background:var(--crit-soft);border:2px solid var(--crit);border-radius:.75rem;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700;padding:.2rem .65rem;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.chip-emerald{background:var(--emerald-soft);color:var(--emerald-ink);border-color:var(--emerald)}
.chip-gold{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold)}
.chip-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn)}
.chip-crit{background:var(--crit-soft);color:var(--crit-ink);border-color:var(--crit)}
.chip-slate{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.chip-navy{background:var(--navy);color:var(--navy-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.55rem 1rem;border-radius:.5rem;font-weight:700;font-size:.95rem;border:2px solid var(--btn-ink);background:var(--surface);color:var(--btn-ink);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn-primary:hover{filter:brightness(.95);background:var(--gold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.opt{position:relative;display:block}
.opt>input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.opt>.face{position:relative;display:flex;flex-direction:column;gap:.1rem;height:100%;box-sizing:border-box;padding:.7rem 2rem .7rem .85rem;border:2px solid var(--line);border-radius:.6rem;background:var(--surface);color:var(--ink);transition:border-color .15s,background .15s}
.opt>.face .t{font-weight:700;font-size:.95rem;line-height:1.3}
.opt>.face .sub{font-size:.8rem;color:var(--muted);line-height:1.3}
.opt>input:hover+.face{border-color:var(--muted)}
.opt>input:checked+.face{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.opt>input:checked+.face .sub{color:var(--navy-sub)}
.opt>input:checked+.face::after{content:"\2713";position:absolute;top:.55rem;right:.75rem;font-weight:800;color:var(--gold)}
.opt>input:focus-visible+.face{outline:3px solid var(--focus);outline-offset:2px}
.opt>input:disabled{cursor:not-allowed}
.opt>input:disabled+.face{opacity:.55}
.field{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:.5rem;background:var(--surface);color:var(--ink);padding:.6rem .75rem;font-size:1rem;font-family:inherit;min-height:44px}
.money{display:flex;align-items:center;gap:.5rem}
.money>span{font-weight:700;color:var(--muted)}
.track{position:relative;height:.7rem;border-radius:999px;background:var(--line);overflow:hidden}
.track.big{height:1.1rem}
.bar{height:100%;border-radius:999px;transition:width .35s ease}
.bar-emerald{background:var(--emerald)}.bar-gold{background:var(--gold)}.bar-warn{background:var(--warn)}.bar-crit{background:var(--crit)}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:2px solid var(--line)}
.tab{flex:1 0 auto;display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border:0;border-bottom:4px solid transparent;background:transparent;color:var(--muted);font-weight:700;font-size:.92rem;cursor:pointer;font-family:inherit;text-align:left;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);background:var(--surface)}
.num{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);font-size:.8rem;font-weight:800;flex:none}
.tab[aria-selected="true"] .num{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.num.ok{background:var(--emerald);border-color:var(--emerald);color:#fff}
.scen{text-align:left;font-family:inherit;cursor:pointer;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:.75rem;padding:.85rem 1rem}
.scen:hover{border-color:var(--muted)}
.scen[aria-pressed="true"]{border-color:var(--navy);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--navy)}
.row{display:flex;gap:.75rem;align-items:flex-start;padding:.75rem;border:1px solid var(--line);border-radius:.6rem;background:var(--surface);cursor:pointer}
.row input[type=checkbox]{width:1.35rem;height:1.35rem;margin-top:.1rem;flex:none;accent-color:var(--emerald);cursor:pointer}
.row.done{background:var(--surface-2)}
.row.done .rt{text-decoration:line-through;color:var(--muted)}
.rt{font-weight:600;line-height:1.35}
.rw{font-size:.82rem;color:var(--muted);margin-top:.15rem}
.flag{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .75rem;border-radius:.5rem;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);font-size:.9rem}
.flag b{color:var(--warn-ink)}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
textarea.mono{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:.5rem;background:var(--surface-2);color:var(--ink);padding:.75rem;font-size:.8rem;line-height:1.55;resize:vertical}
details>summary{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){'use strict';
/*LOGIC_START*/
const DISCHARGE=[
  {v:'honorable',t:'Honorable',s:'Broadest access to VA benefits'},
  {v:'general',t:'General',s:'Under honorable conditions'},
  {v:'other',t:'Other',s:'OTH, uncharacterized, or not sure'}];
const RATING=[
  {v:'0',t:'0%',s:'No rating, or rated 0%'},
  {v:'10-40',t:'10–40%',s:'Partial rating'},
  {v:'50-90',t:'50–90%',s:'Substantial rating'},
  {v:'100',t:'100%',s:'Total rating'}];
const STATES=[
  {v:'California',t:'California'},{v:'Florida',t:'Florida'},{v:'Texas',t:'Texas'},{v:'Other',t:'Other state'}];
const GOALS=[
  {v:'purchase',t:'First-time home purchase',s:'Buy with a VA-backed loan'},
  {v:'construction',t:'Single-close construction or land build',s:'One loan to build and finance'},
  {v:'rental',t:'Rental assistance / HUD-VASH',s:'Vouchers and rapid rehousing'},
  {v:'peer',t:'Peer support & career transition',s:'Peer specialist and federal hiring paths'}];
const CREDIT=[
  {v:'lt580',t:'Below 580'},{v:'580-619',t:'580–619'},{v:'620-679',t:'620–679'},{v:'680+',t:'680+'}];
const VERIF=[
  ['v1','DD Form 214 reviewed and discharge status confirmed'],
  ['v2','VA Benefits Summary Letter reviewed (rating and monthly amount)'],
  ['v3','Income, debts and credit checked against source documents'],
  ['v4','Program eligibility confirmed with each program or lender'],
  ['v5','Plan reviewed with the veteran and next steps agreed']];
const ST={
  likely:{t:'Likely fit',tone:'emerald',i:'✓',o:0},
  possible:{t:'Possible fit',tone:'gold',i:'◐',o:1},
  review:{t:'Needs review',tone:'warn',i:'!',o:2},
  notfocus:{t:'Not your stated goal',tone:'slate',i:'–',o:3}};
const WEIGHTS={
  purchase:{elig:.25,ben:.10,cred:.25,aff:.25,cash:.15},
  construction:{elig:.20,ben:.10,cred:.25,aff:.25,cash:.20},
  rental:{elig:.35,ben:.20,cred:.10,aff:.20,cash:.15},
  peer:{elig:.30,ben:.25,cred:.10,aff:.15,cash:.20}};
const DIMS={
  elig:'Eligibility & service status',ben:'Benefits leverage (disability rating)',cred:'Credit readiness',
  aff:'Affordability (debt-to-income)',cash:'Cash & assistance'};
const SC=[
  {id:'a',title:'Ready Buyer',tag:'Florida · Home purchase',
   blurb:'Army veteran separated this year, 30% rating, steady job, wants a first home.',
   pf:{discharge:'honorable',rating:'10-40',state:'Florida',goal:'purchase'},
   fin:{credit:'620-679',income:'4200',vaOn:true,vaAmt:'650',debt:'650',savings:'3000',assist:{vaZero:true,dpa:true,calvet:false}}},
  {id:'b',title:'Land & Build',tag:'California · Construction',
   blurb:'Marine Corps veteran, 60% rating, wants to build on land in California. Debts run high.',
   pf:{discharge:'honorable',rating:'50-90',state:'California',goal:'construction'},
   fin:{credit:'620-679',income:'3800',vaOn:true,vaAmt:'1800',debt:'2900',savings:'9000',assist:{vaZero:false,dpa:false,calvet:true}}},
  {id:'c',title:'Housing Crisis',tag:'Texas · Rental assistance',
   blurb:'Air Force veteran with an other-than-honorable discharge, staying with friends, low income.',
   pf:{discharge:'other',rating:'0',state:'Texas',goal:'rental'},
   fin:{credit:'lt580',income:'1400',vaOn:false,vaAmt:'',debt:'650',savings:'0',assist:{vaZero:false,dpa:false,calvet:false}}}];
const BLANK_PF={discharge:null,rating:null,state:null,goal:null};
const BLANK_FIN={credit:null,income:'',vaOn:false,vaAmt:'',debt:'',savings:'',assist:{vaZero:false,dpa:false,calvet:false}};

const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,''));return isFinite(n)&&n>0?n:0;};
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const lab=(L,v)=>{const o=L.find(x=>x.v===v);return o?o.t:'';};
const isOwn=g=>g==='purchase'||g==='construction';

function bandOf(s){
  if(s>=80)return{k:'ready',tone:'emerald',label:'Ready to engage programs'};
  if(s>=60)return{k:'near',tone:'gold',label:'Near-ready: a few gaps to close'};
  if(s>=40)return{k:'build',tone:'warn',label:'Building: focus on the priority gaps'};
  return{k:'found',tone:'crit',label:'Foundation first: stabilize and gather documents'};
}

function calc(pf,fin){
  const base=num(fin.income),va=fin.vaOn?num(fin.vaAmt):0;
  const qual=base+va*1.25,debt=num(fin.debt),sav=num(fin.savings);
  const dti=qual>0?debt/qual*100:null;
  const pct={
    elig:{honorable:1,general:.8,other:.35}[pf.discharge],
    ben:{'0':.2,'10-40':.5,'50-90':.8,'100':1}[pf.rating],
    cred:{lt580:.2,'580-619':.5,'620-679':.75,'680+':1}[fin.credit],
    aff:dti===null?0:dti<=36?1:dti<=41?.85:dti<=50?.5:.2,
    cash:Math.min(1,(sav>=5000?.3:sav>=2000?.2:sav>0?.1:0)+(fin.assist.vaZero?.4:0)+((fin.assist.dpa||(fin.assist.calvet&&pf.state==='California'))?.3:0))};
  const W=WEIGHTS[pf.goal];
  const notes={
    elig:lab(DISCHARGE,pf.discharge)+' discharge',
    ben:'Rating '+lab(RATING,pf.rating),
    cred:'Credit tier '+lab(CREDIT,fin.credit),
    aff:dti===null?'No income entered':'About '+Math.round(dti)+'% of qualifying income (benchmark 41%)',
    cash:(sav>0?money(sav)+' saved':'No savings entered')+(fin.assist.vaZero?', VA 0% down':'')+((fin.assist.dpa||(fin.assist.calvet&&pf.state==='California'))?', state help':'')};
  const dims=Object.keys(DIMS).map(k=>({key:k,label:DIMS[k],pct:pct[k],w:W[k],pts:pct[k]*W[k]*100,max:W[k]*100,note:notes[k]}));
  const score=Math.round(dims.reduce((s,d)=>s+d.pts,0));
  let lever=dims.slice().sort((a,b)=>b.w*(1-b.pct)-a.w*(1-a.pct))[0];
  const tips={
    elig:'Confirm discharge status. A VA determination or a discharge review can open more programs.',
    ben:'Ask an accredited Veterans Service Officer whether a new or increased disability claim is appropriate.',
    cred:'Credit is the biggest lever. Fix report errors, lower card balances, and avoid new accounts.',
    aff:dti===null?'Enter income so affordability can be scored.':'Lower monthly debt or document more income to reach a 41% ratio.',
    cash:'Look into down payment help and your VA 0%-down entitlement to strengthen cash position.'};
  const leverTxt=lever.w*(1-lever.pct)<.03?'No large gaps. Keep documents current and re-check before applying.':tips[lever.key];
  const flags=[];
  if(pf.discharge==='other')flags.push('Discharge status is Other. VA program eligibility depends on a character-of-discharge decision, so do not tell the veteran they are eligible or ineligible.');
  if(pf.discharge==='general')flags.push('General discharge: most VA benefits stay open, but confirm on the COE or an eligibility letter.');
  if(pf.rating==='0'&&fin.vaOn)flags.push('VA compensation income is entered but the rating is 0%. Check the Benefits Summary Letter.');
  if(fin.vaOn&&va===0)flags.push('The tax-free VA compensation toggle is on but no amount is entered.');
  if(dti===null)flags.push('No income entered, so affordability scores zero.');
  else if(dti>50)flags.push('Debt-to-income is about '+Math.round(dti)+'%, well above the 41% benchmark. Most lenders will not approve at this level.');
  else if(dti>41)flags.push('Debt-to-income is about '+Math.round(dti)+'%, above the 41% VA benchmark lenders often start from.');
  if(fin.credit==='lt580'&&isOwn(pf.goal))flags.push('Most lenders look for about 620 or higher. Plan credit repair before applying.');
  if(pf.goal==='construction'&&(fin.credit==='lt580'||fin.credit==='580-619'))flags.push('Construction financing usually has stricter credit and reserve rules than a standard purchase.');
  if(fin.assist.calvet&&pf.state!=='California')flags.push('CalVet is selected but the target state is not California. The score ignores it.');
  if(fin.assist.vaZero&&pf.discharge==='other')flags.push('VA 0%-down is marked, but discharge status needs review first.');
  return{qual,debt,dti,sav,dims,score,band:bandOf(score),lever,leverTxt,flags,va};
}

function programs(pf,fin,c){
  const out=[],g=pf.goal,own=isOwn(g),oth=pf.discharge==='other',rent=g==='rental',peer=g==='peer',r=pf.rating;
  const nf=['Not tied to your stated goal.'];
  {
    let status='notfocus',why=['Your goal is not buying or building, but your loan entitlement stays available for later.'],next='Revisit if your goal changes.';
    if(own){
      status=oth?'review':fin.credit==='lt580'?'possible':'likely';
      why=[pf.discharge==='honorable'?'An honorable discharge is the strongest basis for VA loan entitlement.':pf.discharge==='general'?'A general discharge usually keeps loan entitlement, but the VA decides on the COE.':'Discharge status must be reviewed by the VA before entitlement is confirmed.'];
      if(fin.credit==='lt580')why.push('The VA sets no minimum score, but most lenders look for about 620 or higher.');
      if(r!=='0')why.push('A service-connected rating of 10% or more generally exempts you from the VA funding fee.');
      if(g==='construction')why.push('The VA does not lend directly for construction. Ask lenders about construction-to-permanent loans that use VA backing.');
      next='Request the Certificate of Eligibility (COE), then compare lenders with VA loan experience.';
    }
    out.push({id:'valoan',name:'VA Home Loan',status,why,next,src:['VA home loans','https://www.va.gov/housing-assistance/home-loans/']});
  }
  {
    let name,src,status='notfocus',why=nf,next='Revisit if your goal changes.';
    if(pf.state==='California'){name='CalVet Home Loan, including single-close construction';src=['CalVet','https://www.calvet.ca.gov/'];
      if(own){status=oth?'review':g==='construction'?'likely':'possible';
        why=['California veterans may qualify for CalVet financing under the program’s own service and residency rules.'];
        if(g==='construction')why.push('You chose a build goal. Ask CalVet about its single-close construction option and confirm current terms.');
        if(fin.assist.calvet)why.push('You marked CalVet as an assistance source.');
        next='Contact CalVet to confirm eligibility, current rates and construction terms.';}}
    else if(pf.state==='Florida'){name='Florida Housing: Hometown Heroes and down payment help';src=['Florida Housing','https://www.floridahousing.org/'];
      if(own){status='review';why=['Florida Housing runs down payment programs with occupation, income and price limits.','Check whether your employer and household income fit the current rules.'];next='Review the current program list and lender requirements.';}}
    else if(pf.state==='Texas'){name='Texas Veterans Land Board and TSAHC programs';src=['Texas VLB','https://vlb.texas.gov/'];
      if(own){status=oth?'review':'possible';why=['Texas offers veteran land and home loans through the VLB and homebuyer help through TSAHC.','Each program has residency and service rules.'];next='Confirm eligibility and current terms with the VLB or a participating lender.';}}
    else{name='State veteran and housing-finance programs';src=['VA.gov','https://www.va.gov/'];
      if(own){status='review';why=['Most states run a veterans affairs office and a housing finance agency with down payment help.'];next='Search your state veterans affairs office and housing finance agency.';}}
    out.push({id:'state',name,status,why,next,src});
  }
  out.push({id:'vash',name:'HUD-VASH housing vouchers',status:rent?(oth?'review':'possible'):'notfocus',
    why:rent?['HUD-VASH pairs a housing voucher with VA case management for veterans who are homeless or at risk.','You must be eligible for VA health care, and referrals come through a VA medical center.'].concat(oth?['Your discharge status needs review before VA health care eligibility is confirmed.']:[]):nf,
    next:rent?'Call 1-877-424-3838 or contact the local VA medical center homeless program for screening.':'Revisit if your goal changes.',
    src:['VA homeless programs','https://www.va.gov/homeless/']});
  out.push({id:'ssvf',name:'SSVF rapid rehousing',status:rent?(oth?'review':'possible'):'notfocus',
    why:rent?['Supportive Services for Veteran Families offers rapid rehousing and prevention help through local nonprofit grantees.','Households generally must be homeless or at risk, with low income (often under 50% of area median).']:nf,
    next:rent?'Find the nearest SSVF provider and ask about a screening appointment.':'Revisit if your goal changes.',
    src:['SSVF at VA.gov','https://www.va.gov/homeless/ssvf/']});
  out.push({id:'peer',name:'VA Peer Support Specialist pathway',status:peer?(oth?'review':'likely'):'notfocus',
    why:peer?['VA Peer Support Specialists are Veterans who use lived experience to support other Veterans in VA care.','Typical requirements include veteran status, peer support training and certification. Confirm on the job posting.']:nf,
    next:peer?'Search USAJOBS for peer support specialist roles and ask your state about certification training.':'Revisit if your goal changes.',
    src:['USAJOBS','https://www.usajobs.gov/']});
  {
    const status=r==='0'?(peer?'review':'notfocus'):(peer?'likely':'possible');
    let why;

function redact(text){
  let n=0;const hit=()=>{n++;return'[REDACTED]';};
  const out=String(text||'')
    .replace(/\b\d{3}[- ]?\d{2}[- ]?\d{4}\b/g,hit)
    .replace(/\b[Cc]-?\d{7,9}\b/g,hit)
    .replace(/\b\d{8,10}\b/g,hit)
    .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,hit)
    .replace(/\(?\b\d{3}\)?[-. ]\d{3}[-. ]\d{4}\b/g,hit)
    .replace(/\b\d{1,6}\s+(?:[A-Za-z0-9.'-]+\s+){1,4}(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Drive|Dr|Lane|Ln|Court|Ct|Way|Place|Pl|Circle|Cir|Highway|Hwy)\b\.?/gi,hit);
  return{text:out,count:n};
}

  add();add('5. PROGRAMS TO SCREEN');
  progs.filter(p=>p.status!=='notfocus').forEach(p=>add('- '+p.name+' ['+ST[p.status].t+']: '+p.next));
  add('- Programs not tied to the stated goal: '+(progs.filter(p=>p.status==='notfocus').map(p=>p.name).join('; ')||'none'));
  add();add('6. 30/60/90-DAY ACTION PLAN');
  phases.forEach(ph=>{add(ph[1]);pl[ph[0]].forEach(i=>add('  ['+(done[i.id]?'x':' ')+'] '+i.t));});
  add();add('7. CASEWORKER VERIFICATION CHECKLIST ('+vcount+' of '+VERIF.length+' attested)');
  VERIF.forEach(v=>add('  ['+(verif[v[0]]?'x':' ')+'] '+v[1]+(verif[v[0]]?'':' - NOT YET VERIFIED')));
  add();add('8. CASE NOTES (auto-redacted)');

  add('Verification status: '+vcount+' of '+VERIF.length+' checklist items attested. Program rules change often; confirm with VA.gov and each program.');

const TABS=[['Transition profile'],['Financial & credit'],['Readiness dashboard'],['30/60/90 plan & handoff']];

function App(){
  const [sid,setSid]=useState('a');
  const [pf,setPf]=useState(clone(SC[0].pf));
  const [fin,setFin]=useState(clone(SC[0].fin));
  const [tab,setTab]=useState(0);
  const [done,setDone]=useState({});
  const [verif,setVerif]=useState({});
  const [notes,setNotes]=useState('');
  const [msg,setMsg]=useState('');
  const [dl,setDl]=useState(null);
  const sumRef=useRef(null),tabsRef=useRef(null),tabBtns=useRef([]),first=useRef(true);

  useEffect(()=>{
    let on=true;
    (async()=>{try{const cl=window.claude;if(cl&&cl.use){const d=await cl.use('downloads');if(on&&d)setDl(d);}}catch(err){}})();
    return()=>{on=false;};
  },[]);
  useEffect(()=>{
    if(first.current){first.current=false;return;}
    const el=tabsRef.current;if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'});
  },[tab]);

  const pfOk=!!(pf.discharge&&pf.rating&&pf.state&&pf.goal);
  const ready=pfOk&&!!fin.credit;
  const c=useMemo(()=>ready?calc(pf,fin):null,[ready,pf,fin]);
  const progs=useMemo(()=>c?programs(pf,fin,c):[],[c,pf,fin]);
  const pl=useMemo(()=>c?plan(pf,fin,c):null,[c,pf,fin]);
  const demo=sid==='a'||sid==='b'||sid==='c';
  const summaryText=useMemo(()=>c?buildSummary({pf,fin,c,progs,pl,done,verif,notes,demo,date:new Date().toISOString().slice(0,10)}):'',[c,progs,pl,done,verif,notes,demo]);
  const redactCount=redact(notes).count;

  const edited=()=>{if(sid==='a'||sid==='b'||sid==='c')setSid('custom');setMsg('');};
  const S={
    sid,pf,fin,c,progs,pl,done,verif,notes,setNotes,msg,dl,sumRef,summary:summaryText,redactCount,
    go:setTab,
    load:s=>{setSid(s.id);setPf(clone(s.pf));setFin(clone(s.fin));setDone({});setVerif({});setNotes('');setMsg('');},
    blank:()=>{setSid('blank');setPf(clone(BLANK_PF));setFin(clone(BLANK_FIN));setDone({});setVerif({});setNotes('');setMsg('');setTab(0);},
    upPf:(k,v)=>{edited();setPf(x=>Object.assign({},x,{[k]:v}));},
    upFin:(k,v)=>{edited();setFin(x=>Object.assign({},x,{[k]:v}));},
    upAssist:(k,v)=>{edited();setFin(x=>Object.assign({},x,{assist:Object.assign({},x.assist,{[k]:v})}));},
    toggleDone:id=>setDone(x=>Object.assign({},x,{[id]:!x[id]})),
    toggleVerif:id=>setVerif(x=>Object.assign({},x,{[id]:!x[id]})),
    copy:async()=>{
      try{await navigator.clipboard.writeText(summaryText);setMsg('Copied. Paste it into your case-management system.');}
      catch(err){const el=sumRef.current;if(el){el.focus();el.select();}setMsg('Copy was blocked here. The summary is selected: press Ctrl+C (Command+C on Mac).');}
    },
    save:async()=>{
      try{await dl.save({filename:'caseworker-handoff-summary-REDACTED.txt',data:summaryText});setMsg('Saved. Keep the file in your secure case system only.');}
      catch(err){setMsg(err&&err.code==='declined'?'Save canceled.':'Saving is not available in this view. Use Copy summary instead.');}
    },
    selectAll:()=>{const el=sumRef.current;if(el){el.focus();el.select();setMsg('Summary selected. Press Ctrl+C (Command+C on Mac) to copy.');}}
  };

  const stepDone=[pfOk,!!fin.credit&&num(fin.income)>0,!!c&&tab>2,false];
  const onKey=ev=>{
    let n=null;
    if(ev.key==='ArrowRight')n=(tab+1)%4;else if(ev.key==='ArrowLeft')n=(tab+3)%4;else if(ev.key==='Home')n=0;else if(ev.key==='End')n=3;
    if(n!==null){ev.preventDefault();setTab(n);setTimeout(()=>{const b=tabBtns.current[n];if(b)b.focus();},0);}
  };
  const panels=[ProfileTab,FinanceTab,DashTab,PlanTab];

  return div(null,
    Header(S),
    div({className:'gut'},div({className:'mx-auto max-w-6xl flex flex-col gap-6',style:{paddingTop:'1.5rem',paddingBottom:'2rem'}},
      Privacy(),FourD(),Scenarios(S),
      section({'aria-label':'Intake and readiness steps'},
        div({ref:tabsRef,className:'tabs card',role:'tablist','aria-label':'Navigator steps',onKeyDown:onKey,style:{borderBottomLeftRadius:0,borderBottomRightRadius:0,scrollMarginTop:'8px'}},
          ...TABS.map((t,i)=>button({key:i,type:'button',role:'tab',id:'tab-'+i,'aria-selected':tab===i,'aria-controls':'panel',tabIndex:tab===i?0:-1,className:'tab',ref:el=>{tabBtns.current[i]=el;},onClick:()=>setTab(i)},
            span({className:'num'+(i<2&&stepDone[i]?' ok':''),'aria-hidden':'true'},(i<2&&stepDone[i])?'✓':String(i+1)),
            span(null,t[0])))),
        div({id:'panel',role:'tabpanel','aria-labelledby':'tab-'+tab,className:'card p-5',style:{borderTopLeftRadius:0,borderTopRightRadius:0,borderTop:0,minWidth:0}},
          panels[tab](S),
          div({className:'flex justify-between gap-2 flex-wrap',style:{marginTop:'1.75rem',paddingTop:'1rem',borderTop:'1px solid var(--line)'}},
            button({type:'button',className:'btn',disabled:tab===0,onClick:()=>setTab(tab-1)},'← Back'),
            button({type:'button',className:'btn btn-primary',disabled:tab===3,onClick:()=>setTab(tab+1)},tab<3?'Next: '+TABS[tab+1][0]+' →':'Last step')))),
      Footer())));
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
